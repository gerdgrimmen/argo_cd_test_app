apiVersion: apps/v1
kind: Deployment
metadata:
  name: mein-webserver
  namespace: default
spec:
  replicas: 1
  selector:
    matchLabels:
      app: webserver
  template:
    metadata:
      labels:
        app: webserver
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: webserver-service
  namespace: default
spec:
  type: NodePort
  selector:
    app: webserver
  ports:
  - port: 80
    targetPort: 80
    nodePort: 32000
